<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200">
  <rect width="360" height="200" fill="#fdf6ed"/>
  <!-- workbench surface -->
  <rect x="0" y="140" width="360" height="16" rx="4" fill="#c17b3c" opacity=".3"/>
  <!-- large wrench -->
  <path d="M80 50 Q98 30 116 50 L108 70 L74 70 Z" fill="#7a6e5f" opacity=".5"/>
  <rect x="88" y="68" width="12" height="70" rx="5" fill="#7a6e5f" opacity=".4"/>
  <!-- screwdriver -->
  <rect x="175" y="30" width="14" height="90" rx="7" fill="#7a6e5f" opacity=".4"/>
  <rect x="178" y="118" width="8" height="30" rx="2" fill="#7a6e5f" opacity=".55"/>
  <!-- circuit board -->
  <rect x="210" y="55" width="110" height="70" rx="6" fill="#2a6b45" opacity=".15"/>
  <rect x="220" y="65" width="14" height="9" rx="3" fill="#2a6b45" opacity=".4"/>
  <rect x="240" y="63" width="9" height="14" rx="3" fill="#2a6b45" opacity=".4"/>
  <rect x="256" y="65" width="14" height="9" rx="3" fill="#2a6b45" opacity=".35"/>
  <rect x="276" y="63" width="9" height="14" rx="3" fill="#2a6b45" opacity=".4"/>
  <rect x="292" y="65" width="14" height="9" rx="3" fill="#2a6b45" opacity=".35"/>
  <line x1="220" y1="90" x2="305" y2="90" stroke="#2a6b45" stroke-width="2" opacity=".2"/>
  <line x1="220" y1="100" x2="305" y2="100" stroke="#2a6b45" stroke-width="2" opacity=".2"/>
  <!-- solder point dots -->
  <circle cx="228" cy="110" r="4" fill="#c17b3c" opacity=".4"/>
  <circle cx="248" cy="110" r="4" fill="#c17b3c" opacity=".4"/>
  <circle cx="268" cy="110" r="4" fill="#c17b3c" opacity=".4"/>
  <circle cx="288" cy="110" r="4" fill="#c17b3c" opacity=".4"/>
  <!-- magnifying glass -->
  <circle cx="155" cy="85" r="30" fill="none" stroke="#7a6e5f" stroke-width="6" opacity=".3"/>
  <line x1="177" y1="107" x2="200" y2="130" stroke="#7a6e5f" stroke-width="8" stroke-linecap="round" opacity=".3"/>
</svg>
