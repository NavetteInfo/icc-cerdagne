<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <rect width="240" height="180" fill="#e8f4ee" rx="16"/>
  <!-- sky gradient circle (sun) -->
  <circle cx="185" cy="45" r="28" fill="#c17b3c" opacity=".18"/>
  <circle cx="185" cy="45" r="17" fill="#c17b3c" opacity=".35"/>
  <!-- sun rays -->
  <line x1="185" y1="12" x2="185" y2="4"  stroke="#c17b3c" stroke-width="3" stroke-linecap="round" opacity=".4"/>
  <line x1="207" y1="23" x2="213" y2="17" stroke="#c17b3c" stroke-width="3" stroke-linecap="round" opacity=".4"/>
  <line x1="218" y1="45" x2="226" y2="45" stroke="#c17b3c" stroke-width="3" stroke-linecap="round" opacity=".4"/>
  <line x1="207" y1="67" x2="213" y2="73" stroke="#c17b3c" stroke-width="3" stroke-linecap="round" opacity=".4"/>
  <!-- mountain back layer -->
  <path d="M0 145 L50 80 L100 115 L150 60 L200 100 L240 75 L240 145 Z" fill="#2a6b45" opacity=".1"/>
  <!-- mountain mid -->
  <path d="M0 145 L65 75 L115 145 Z" fill="#2a6b45" opacity=".22"/>
  <!-- mountain front -->
  <path d="M95 145 L155 55 L215 145 Z" fill="#2a6b45" opacity=".38"/>
  <!-- snow caps -->
  <path d="M65 75 L52 100 L78 100 Z" fill="white" opacity=".65"/>
  <path d="M155 55 L142 82 L168 82 Z" fill="white" opacity=".65"/>
  <!-- ground -->
  <rect x="0" y="143" width="240" height="6" fill="#2a6b45" rx="3" opacity=".15"/>
  <!-- small tree left -->
  <rect x="20" y="128" width="5" height="16" rx="2" fill="#2a6b45" opacity=".25"/>
  <ellipse cx="22" cy="122" rx="10" ry="12" fill="#2a6b45" opacity=".2"/>
  <!-- small tree right -->
  <rect x="210" y="126" width="5" height="18" rx="2" fill="#2a6b45" opacity=".25"/>
  <ellipse cx="212" cy="120" rx="10" ry="12" fill="#2a6b45" opacity=".2"/>
</svg>
