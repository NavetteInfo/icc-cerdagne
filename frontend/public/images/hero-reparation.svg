  <rect x="35" y="122" width="8" height="28" rx="3" fill="#c17b3c" opacity=".25"/>
  <rect x="157" y="122" width="8" height="28" rx="3" fill="#c17b3c" opacity=".25"/>
  <!-- lamp -->
  <line x1="155" y1="20" x2="155" y2="70" stroke="#7a6e5f" stroke-width="4" stroke-linecap="round" opacity=".4"/>
  <path d="M135 70 L175 70 L165 90 L145 90 Z" fill="#c17b3c" opacity=".4"/>
  <ellipse cx="155" cy="90" rx="14" ry="5" fill="#c17b3c" opacity=".2"/>
