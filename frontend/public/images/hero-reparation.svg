  <rect x="60" y="88" width="6" height="10" rx="2" fill="#2a6b45" opacity=".4"/>
  <rect x="72" y="90" width="8" height="6" rx="2" fill="#2a6b45" opacity=".4"/>
  <rect x="85" y="89" width="6" height="8" rx="2" fill="#2a6b45" opacity=".4"/>
  <line x1="45" y1="93" x2="100" y2="93" stroke="#2a6b45" stroke-width="1.5" opacity=".25"/>
  <!-- screwdriver -->
  <line x1="125" y1="55" x2="95" y2="95" stroke="#7a6e5f" stroke-width="5" stroke-linecap="round" opacity=".5"/>
  <line x1="125" y1="55" x2="135" y2="45" stroke="#7a6e5f" stroke-width="9" stroke-linecap="round" opacity=".3"/>
  <!-- wrench -->
  <path d="M50 45 Q58 35 68 45 L62 55 L44 55 Z" fill="#7a6e5f" opacity=".4"/>
  <line x1="56" y1="55" x2="40" y2="80" stroke="#7a6e5f" stroke-width="5" stroke-linecap="round" opacity=".4"/>
