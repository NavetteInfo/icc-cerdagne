<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200">
  <rect width="360" height="200" fill="#fdf6ed"/>
  <!-- loom/weave pattern -->
  <line x1="60" y1="30" x2="60" y2="170" stroke="#c17b3c" stroke-width="6" stroke-linecap="round" opacity=".3"/>
  <line x1="85" y1="30" x2="85" y2="170" stroke="#c17b3c" stroke-width="6" stroke-linecap="round" opacity=".25"/>
  <line x1="110" y1="30" x2="110" y2="170" stroke="#c17b3c" stroke-width="6" stroke-linecap="round" opacity=".3"/>
  <line x1="135" y1="30" x2="135" y2="170" stroke="#c17b3c" stroke-width="6" stroke-linecap="round" opacity=".25"/>
  <line x1="160" y1="30" x2="160" y2="170" stroke="#c17b3c" stroke-width="6" stroke-linecap="round" opacity=".3"/>
  <!-- horizontal weave -->
  <line x1="45" y1="55" x2="175" y2="55" stroke="#2a6b45" stroke-width="8" stroke-linecap="round" opacity=".3"/>
  <line x1="45" y1="80" x2="175" y2="80" stroke="#7a6e5f" stroke-width="8" stroke-linecap="round" opacity=".25"/>
  <line x1="45" y1="105" x2="175" y2="105" stroke="#2a6b45" stroke-width="8" stroke-linecap="round" opacity=".3"/>
  <line x1="45" y1="130" x2="175" y2="130" stroke="#7a6e5f" stroke-width="8" stroke-linecap="round" opacity=".25"/>
  <line x1="45" y1="155" x2="175" y2="155" stroke="#2a6b45" stroke-width="8" stroke-linecap="round" opacity=".3"/>
  <!-- pottery vase -->
  <path d="M230 170 Q210 140 215 95 Q220 60 250 50 Q280 60 285 95 Q290 140 270 170 Z" fill="#c17b3c" opacity=".28"/>
  <ellipse cx="250" cy="170" rx="40" ry="8" fill="#c17b3c" opacity=".2"/>
  <ellipse cx="250" cy="50" rx="22" ry="8" fill="#c17b3c" opacity=".3"/>
  <!-- vase detail lines -->
  <path d="M220 100 Q250 108 280 100" fill="none" stroke="#c17b3c" stroke-width="2" opacity=".35"/>
  <path d="M217 120 Q250 130 283 120" fill="none" stroke="#c17b3c" stroke-width="2" opacity=".35"/>
  <!-- needle/pin -->
  <line x1="320" y1="20" x2="300" y2="160" stroke="#7a6e5f" stroke-width="4" stroke-linecap="round" opacity=".35"/>
  <circle cx="320" cy="20" r="7" fill="#c17b3c" opacity=".4"/>
</svg>
