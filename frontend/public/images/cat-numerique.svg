  <rect x="60" y="148" width="240" height="12" rx="6" fill="#2a6b45" opacity=".18"/>
  <rect x="120" y="148" width="120" height="5" rx="3" fill="#2a6b45" opacity=".12"/>
  <!-- shield icon top-right -->
  <path d="M295 20 L320 30 L320 58 Q320 75 295 82 Q270 75 270 58 L270 30 Z" fill="#2a6b45" opacity=".18"/>
  <rect x="283" y="50" width="24" height="18" rx="4" fill="#2a6b45" opacity=".4"/>
  <path d="M287 50 L287 43 Q295 36 303 43 L303 50" fill="none" stroke="#2a6b45" stroke-width="4" stroke-linecap="round" opacity=".4"/>
