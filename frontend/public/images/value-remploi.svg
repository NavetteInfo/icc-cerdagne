<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <rect width="240" height="180" fill="#e8f4ee" rx="16"/>
  <!-- circular arrows outer -->
  <circle cx="120" cy="90" r="62" fill="none" stroke="#2a6b45" stroke-width="3" opacity=".12"/>
  <!-- arc top (green) -->
  <path d="M120 28 A62 62 0 0 1 182 90" fill="none" stroke="#2a6b45" stroke-width="5" stroke-linecap="round" opacity=".5"/>
  <!-- arrowhead top-right -->
  <polygon points="185,78 185,104 163,91" fill="#2a6b45" opacity=".5"/>
  <!-- arc bottom (earth) -->
  <path d="M120 152 A62 62 0 0 1 58 90" fill="none" stroke="#c17b3c" stroke-width="5" stroke-linecap="round" opacity=".5"/>
  <!-- arrowhead bottom-left -->
  <polygon points="55,102 55,78 77,90" fill="#c17b3c" opacity=".5"/>
  <!-- wrench shape -->
  <rect x="103" y="80" width="34" height="10" rx="5" fill="#2a6b45" transform="rotate(45 120 90)"/>
  <circle cx="108" cy="80" r="11" fill="none" stroke="#2a6b45" stroke-width="6"/>
  <circle cx="132" cy="100" r="11" fill="none" stroke="#2a6b45" stroke-width="6"/>
  <!-- inner dot -->
  <circle cx="120" cy="90" r="6" fill="#c17b3c" opacity=".4"/>
</svg>
